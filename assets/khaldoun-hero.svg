<svg width="1300" height="680" viewBox="0 0 1300 680" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Main Gradient -->
  <linearGradient id="mainGradient" x1="0" y1="0" x2="1300" y2="680" gradientUnits="userSpaceOnUse">
    <stop stop-color="#8B45E8"/>
    <stop offset="0.5" stop-color="#B64BD0"/>
    <stop offset="1" stop-color="#E84AAE"/>
  </linearGradient>

  <!-- Card Gradient -->
  <linearGradient id="glassGradient" x1="0" y1="0" x2="1000" y2="400">
    <stop stop-color="white" stop-opacity="0.22"/>
    <stop offset="1" stop-color="white" stop-opacity="0.08"/>
  </linearGradient>

  <!-- Shadow -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity="0.18"/>
  </filter>

  <!-- Soft Blur -->
  <filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
  </filter>

</defs>

<!-- ================= BACKGROUND ================= -->

<rect
  x="15"
  y="15"
  width="1270"
  height="650"
  rx="42"
  fill="url(#mainGradient)"
/>

<!-- Decorative blobs -->

<circle
  cx="1120"
  cy="100"
  r="170"
  fill="#FF8AE1"
  opacity="0.16"
  filter="url(#blur)"
/>

<circle
  cx="270"
