<text x="525" y="395" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#202433">Education</text>
<text x="490" y="430" font-family="Arial, sans-serif" font-size="13" fill="#6F7480">Badr University in Cairo</text>
<text x="490" y="453" font-family="Arial, sans-serif" font-size="13" fill="#6F7480">Computer Engineering • GPA 3.47</text>

