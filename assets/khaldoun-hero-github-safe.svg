  y="155"
  font-family="Arial, sans-serif"
  font-size="82"
  font-weight="700"
  letter-spacing="3"
  fill="#FFFFFF">
  KHALDOUN
</text>

<!-- Main panel -->
<rect
  x="70"
  y="225"
  width="1260"
  height="475"
  rx="30"
  fill="url(#panel)"
  stroke="#FFFFFF"
  stroke-opacity="0.20"
  stroke-width="2"/>

<!-- Profile card -->
<rect
  x="100"
  y="255"
  width="325"
  height="415"
  rx="24"
  fill="#FFFFFF"
  fill-opacity="0.96"/>

