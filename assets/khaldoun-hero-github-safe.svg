<rect x="140" y="520" width="70" height="30" rx="15" fill="#D1FAE5"/>
<text x="175" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#064E3B">AI</text>

<rect x="220" y="520" width="85" height="30" rx="15" fill="#ECFCCB"/>
<text x="262" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4D7C0F">Vision</text>

<rect x="315" y="520" width="75" height="30" rx="15" fill="#DCFCE7"/>
<text x="352" y="540" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#047857">Python</text>

<rect x="165" y="560" width="65" height="30" rx="15" fill="#F0FDFA"/>
<text x="197" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4F46E5">C++</text>

<!-- Right heading -->
