<circle cx="1045" cy="388" r="16" fill="#DCFCE7"/>
<text x="1045" y="394" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#047857">03</text>

<text x="1075" y="395" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#202433">Goal</text>
<text x="1040" y="430" font-family="Arial, sans-serif" font-size="13" fill="#6F7480">Gain practical experience</text>
<text x="1040" y="453" font-family="Arial, sans-serif" font-size="13" fill="#6F7480">Build real-world solutions</text>

<!-- Interests strip -->
