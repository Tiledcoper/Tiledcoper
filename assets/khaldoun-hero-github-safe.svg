<text x="495" y="580" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">AI</text>
<text x="555" y="580" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">Machine Learning</text>
<text x="715" y="580" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">Deep Learning</text>
<text x="865" y="580" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">Computer Vision</text>
<text x="1040" y="580" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF">Software Development</text>

<!-- Accent bars -->
<rect x="495" y="605" width="42" height="6" rx="3" fill="#BBF7D0"/>
<rect x="555" y="605" width="135" height="6" rx="3" fill="#86EFAC"/>
<rect x="715" y="605" width="125" height="6" rx="3" fill="#D9F99D"/>
