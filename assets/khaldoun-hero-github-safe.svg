<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">

<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#064E3B"/>
    <stop offset="50%" stop-color="#10B981"/>
    <stop offset="100%" stop-color="#A3E635"/>
  </linearGradient>

  <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
  </linearGradient>
</defs>

<!-- Main background -->
<rect x="18" y="18" width="1364" height="784" rx="46" fill="url(#bg)"/>

<!-- Soft decorative circles -->
<circle cx="1180" cy="130" r="150" fill="#D9F99D" opacity="0.12"/>
<circle cx="220" cy="700" r="130" fill="#022C22" opacity="0.12"/>

<!-- Title -->
<text
